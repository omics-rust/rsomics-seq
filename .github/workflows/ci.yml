name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: shenwei356/seqkit
          ref: d13b5fa388cc869de05abe1bdb07980eef5efb4e
          path: target/ci/seqkit
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy

      - name: Verify native host
        shell: bash
        run: |
          set -euo pipefail
          case '${{ matrix.runner }}' in
            ubuntu-24.04) system=Linux; arch=x86_64; host=x86_64-unknown-linux-gnu ;;
            ubuntu-24.04-arm) system=Linux; arch=aarch64; host=aarch64-unknown-linux-gnu ;;
            macos-15-intel) system=Darwin; arch=x86_64; host=x86_64-apple-darwin ;;
            macos-15) system=Darwin; arch=arm64; host=aarch64-apple-darwin ;;
            *) exit 1 ;;
          esac
          test "$(uname -s)" = "$system"
          test "$(uname -m)" = "$arch"
          test -z "${CARGO_BUILD_TARGET:-}"
          rustc -Vv
          test "$(rustc -Vv | sed -n 's/^host: //p')" = "$host"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"
          cache: false

      - name: Build pinned SeqKit oracle
        working-directory: target/ci/seqkit
        run: |
          go build -trimpath -o "$RUNNER_TEMP/seqkit" ./seqkit
          test "$("$RUNNER_TEMP/seqkit" version)" = "seqkit v2.13.0"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - run: cargo fmt --all -- --check
        if: matrix.runner == 'ubuntu-24.04'
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
        if: matrix.runner == 'ubuntu-24.04'
      - run: cargo doc --locked --no-deps --all-features
        if: matrix.runner == 'ubuntu-24.04'
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked
        if: matrix.runner == 'ubuntu-24.04'
      - run: cargo test --locked --all-features
        env:
          RSOMICS_REQUIRE_SEQKIT: "1"
      - run: cargo test --release --locked --all-features
        env:
          RSOMICS_REQUIRE_SEQKIT: "1"
      - run: cargo bench --locked --bench operations -- --test
        if: matrix.runner == 'ubuntu-24.04'
