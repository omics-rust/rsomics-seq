name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: omics-rust/rsomics-common
          ref: 1c51f7d0b356683697942d9c6a0f60585e0dc8a9
          path: deps/rsomics-common
      - uses: actions/checkout@v5
        with:
          repository: omics-rust/rsomics-seqio
          ref: b317e8bcba31f5df697f60b3eb2a5c224b8b8058
          path: deps/rsomics-seqio
      - uses: actions/checkout@v5
        with:
          repository: omics-rust/rsomics-kmer
          ref: 4258ac881119bcee69a3541119bb3e544500743a
          path: deps/rsomics-kmer
      - uses: actions/checkout@v5
        with:
          repository: shenwei356/seqkit
          ref: d13b5fa388cc869de05abe1bdb07980eef5efb4e
          path: deps/seqkit
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"
          cache: false

      - name: Build pinned SeqKit oracle
        working-directory: deps/seqkit
        run: |
          go build -trimpath -o "$RUNNER_TEMP/seqkit" ./seqkit
          test "$("$RUNNER_TEMP/seqkit" version)" = "seqkit v2.13.0"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Configure unpublished foundation revisions
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          rsomics-common = { path = "deps/rsomics-common" }
          rsomics-seqio = { path = "deps/rsomics-seqio" }
          rsomics-kmer = { path = "deps/rsomics-kmer" }
          EOF

      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
        env:
          RSOMICS_REQUIRE_SEQKIT: "1"
      - run: cargo bench --locked --bench operations -- --test
