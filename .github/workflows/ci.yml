name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: omics-rust/rsomics-seqio
          ref: 7b5b1c68f52ec4e86c79db028c0787b0d888faf2
          path: target/ci/rsomics-seqio
      - uses: actions/checkout@v6
        with:
          repository: omics-rust/rsomics-kmer
          ref: 4258ac881119bcee69a3541119bb3e544500743a
          path: target/ci/rsomics-kmer
      - uses: actions/checkout@v6
        with:
          repository: shenwei356/seqkit
          ref: d13b5fa388cc869de05abe1bdb07980eef5efb4e
          path: target/ci/seqkit
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.5"
          cache: false

      - name: Build pinned SeqKit oracle
        working-directory: target/ci/seqkit
        run: |
          go build -trimpath -o "$RUNNER_TEMP/seqkit" ./seqkit
          test "$("$RUNNER_TEMP/seqkit" version)" = "seqkit v2.13.0"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Configure unpublished foundation revisions
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-home"
          cat > "$RUNNER_TEMP/cargo-home/config.toml" <<EOF
          [patch.crates-io]
          rsomics-seqio = { path = "$GITHUB_WORKSPACE/target/ci/rsomics-seqio" }
          rsomics-kmer = { path = "$GITHUB_WORKSPACE/target/ci/rsomics-kmer" }
          EOF
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-home" >> "$GITHUB_ENV"

      - run: cargo fmt --all -- --check
        if: matrix.runner == 'ubuntu-24.04'
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
        if: matrix.runner == 'ubuntu-24.04'
      - run: cargo package --locked
        if: matrix.runner == 'ubuntu-24.04'
      - run: cargo test --locked --all-features
        env:
          RSOMICS_REQUIRE_SEQKIT: "1"
      - run: cargo bench --locked --bench operations -- --test
        if: matrix.runner == 'ubuntu-24.04'
