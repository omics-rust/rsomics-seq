[package]
name = "rsomics-seq"
version = "0.1.0"
description = "Coherent FASTA/FASTQ sequence inspection and transformation utilities"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/omics-rust/rsomics-seq"
authors = ["Zane Leong <efd@live.com>"]
categories = ["science", "command-line-utilities"]
keywords = ["fasta", "fastq", "bioinformatics", "kmer", "seqkit"]
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
rsomics-common = { version = "0.6.3", default-features = false }
rsomics-kmer = "0.2.1"
rsomics-seqio = "0.2.0"
same-file = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1"

[[bench]]
name = "operations"
harness = false
